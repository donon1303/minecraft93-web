name: Daily AI Developer

on:
  schedule:
    # 06:00 по Екатеринбургу (UTC+5) = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-developer
  cancel-in-progress: false

jobs:
  daily-improvements:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить основную ветку
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить Python-скрипт
        run: python -m py_compile scripts/daily_developer.py

      - name: Создать улучшения и отдельные коммиты
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/daily_developer.py
